{# Single shared template for lazy per-series override panels (BF96 / issue #30).
   Placeholders __SID__ are rewritten in overrides.js::ensureOverridePanel. #}
<template id="override-panel-template">
    <div id="panel-__SID__" class="override-panel">
        <div class="override-main">
            <div class="override-field">
                <span class="input-hint">{{ t.alt_title }}</span>
                <input type="text" id="title-__SID__" value="" placeholder="{{ t.placeholder_title }}">
            </div>
            <div class="override-field override-field--magic">
                <span class="input-hint">{{ t.magic_input_hint }}</span>
                <div class="override-magic-row">
                    <select id="provider-__SID__" class="override-provider">
                        <option value="AUTO">{{ t.provider_auto }}</option>
                        {% for scraper in magic_scrapers %}
                        <option value="{{ scraper.id }}">{{ scraper.display_name }}</option>
                        {% endfor %}
                    </select>
                    <input type="text" id="id-__SID__" value="" placeholder="{{ t.placeholder_magic }}">
                </div>
            </div>
            <div class="override-field override-field--pub">
                <span class="input-hint">{{ t.publisher_pref_label }}</span>
                <div class="segmented-control">
                    <input type="radio" name="pubpref-__SID__" id="pub-global-__SID__" value="GLOBAL">
                    <label for="pub-global-__SID__" title="{{ t.publisher_pref_global_title }}">Auto</label>
                    <input type="radio" name="pubpref-__SID__" id="pub-loc-__SID__" value="LOCALIZED">
                    <label for="pub-loc-__SID__" title="{{ t.publisher_pref_localized_title }}">VF/VA</label>
                    <input type="radio" name="pubpref-__SID__" id="pub-orig-__SID__" value="ORIGINAL">
                    <label for="pub-orig-__SID__" title="{{ t.publisher_pref_original_title }}">VO</label>
                </div>
            </div>
            <div class="override-field override-field--save">
                <button type="button" class="btn-success override-save-btn" data-save-override="1">{{ t.save }}</button>
            </div>
        </div>

        <details class="targeted-scraping-details">
            <summary>⚙️ {{ t.targeted_fields }}</summary>
            <div class="override-tf-body">
                <div class="override-tf-toolbar">
                    <button type="button" class="btn-secondary override-tf-btn" data-tf-all="1">{{ t.fields_check_all }}</button>
                    <button type="button" class="btn-secondary override-tf-btn" data-tf-none="1">{{ t.fields_uncheck_all }}</button>
                </div>
                <div class="override-fields-grid">
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-summary-__SID__" data-field="summary"> {{ t.field_summary }}</label>
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-cover-__SID__" data-field="cover"> {{ t.field_cover }}</label>
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-staff-__SID__" data-field="staff"> {{ t.field_staff }}</label>
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-genres-__SID__" data-field="genres"> {{ t.field_genres }}</label>
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-tags-__SID__" data-field="tags"> {{ t.field_tags }}</label>
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-year-__SID__" data-field="year"> {{ t.field_year }}</label>
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-status-__SID__" data-field="status"> {{ t.field_status }}</label>
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-publisher-__SID__" data-field="publisher"> {{ t.field_publisher }}</label>
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-age-__SID__" data-field="age"> {{ t.field_age }}</label>
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-weblinks-__SID__" data-field="weblinks"> {{ t.field_weblinks }}</label>
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-alt_titles-__SID__" data-field="alt_titles"> {{ t.field_alt_titles }}</label>
                    <label class="checkbox-label override-field-chip"><input type="checkbox" id="field-language-__SID__" data-field="language"> {{ t.field_language }}</label>
                </div>
                <div class="override-alt-langs">
                    <span class="input-hint">{{ t.alt_title_langs_label }}</span>
                    <input type="text" id="alt-langs-__SID__" value="" placeholder="{{ t.alt_title_langs_placeholder }}">
                    <small class="text-muted">{{ t.alt_title_langs_hint }}</small>
                </div>
            </div>
        </details>
    </div>
</template>
