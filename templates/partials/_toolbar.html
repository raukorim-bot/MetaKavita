                    <div class="toolbar card">
                        <div class="toolbar-head">
                            <div class="toolbar-head-left">
                                <h2 class="toolbar-title m-0">{{ t.series_avail }}</h2>
                                <label class="toolbar-select-all checkbox-label" for="selectAll">
                                    <input type="checkbox" id="selectAll" onclick="toggleSelectAll()">
                                    <span>{{ t.select_all }}</span>
                                </label>
                                <div class="toolbar-counts">
                                    <span id="visibleCount" class="badge badge-pending toolbar-count">0 {{ t.element }}</span>
                                    <span id="selectedCount" class="badge badge-completed toolbar-count toolbar-count--selected" hidden></span>
                                </div>
                            </div>
                            <div class="toolbar-head-actions">
                                <button type="button" onclick="toggleAllOverridePanels()" class="btn-secondary toolbar-action-btn" title="{{ t.toggle_all_overrides_hint }}">{{ t.toggle_all_overrides }}</button>
                                <button type="button" onclick="saveAllOverrides(this)" class="btn-secondary toolbar-action-btn">{{ t.save_all }}</button>
                            </div>
                        </div>

                        <div class="toolbar-body">
                            <div class="toolbar-group toolbar-group--search">
                                <span class="toolbar-group-label">{{ t.toolbar_group_search }}</span>
                                <div class="toolbar-group-controls">
                                    <input type="text" id="searchInput" class="search-input" placeholder="{{ t.search_placeholder }}" oninput="scheduleFilterSeries()">
                                    <label class="checkbox-label" title="{{ t.search_inside_desc }}">
                                        <input type="checkbox" id="searchInsideCb" onclick="filterSeries()">
                                        {{ t.search_inside }}
                                    </label>
                                </div>
                            </div>

                            <div class="toolbar-group toolbar-group--filters">
                                <span class="toolbar-group-label">{{ t.toolbar_group_filters }}</span>
                                <div class="toolbar-group-controls">
                                    <select id="lib_selector" onchange="loadLibrary(this.value)" class="toolbar-select">
                                        <option value="">{{ t.all_libs }}</option>
                                        {% for lib in libraries %}
                                        <option value="{{ lib.id }}" {% if selected_lib == lib.id|string %}selected{% endif %}>{{ lib.name }}</option>
                                        {% endfor %}
                                    </select>
                                    <select id="statusFilter" onchange="filterSeries()" class="toolbar-select">
                                        <option value="ALL">{{ t.filter_all }}</option>
                                        <option value="PENDING">{{ t.filter_pending }}</option>
                                        <option value="PENDING_REVIEW">{{ t.filter_pending_review }}</option>
                                        <option value="NEEDS_RELOCK">{{ t.filter_needs_relock }}</option>
                                        <option value="COMPLETED">{{ t.filter_completed }}</option>
                                        <option value="NOT_FOUND">{{ t.filter_notfound }}</option>
                                        <option value="IGNORED">{{ t.filter_ignored }}</option>
                                    </select>
                                    <label class="checkbox-label toolbar-hide-ignored">
                                        <input type="checkbox" id="hideIgnoredCb" onclick="filterSeries()" checked>
                                        {{ t.hide_ignored }}
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
