	<!-- MODAL CHANGELOG DYNAMIQUE -->
	<div id="changelogModal" class="modal-overlay" onclick="if(event.target===this) closeChangelogModal()">
		<div class="modal-content modal-shell modal-changelog">
			<div class="modal-header modal-header--changelog">
				<h3 class="m-0"><svg class="mk-ico" aria-hidden="true"><use href="#mk-ico-sparkle"></use></svg>MetaKavita v{{ app_version }}</h3>
				<button type="button" class="close-btn" onclick="closeChangelogModal()">&times;</button>
			</div>
			<div id="changelogModalBody" class="modal-scroll-body changelog-modal-body">

			</div>
			<div class="modal-footer">
				<button type="button" class="btn-primary" onclick="closeChangelogModal()" style="padding: 8px 20px;">

			</div>
		</div>
