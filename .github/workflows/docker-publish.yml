name: Docker Build and Push

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*" ]
    # Guides et captures GitHub : pas dans l'image (assets/ est déjà
    # dans .dockerignore). CHANGELOG.md n'est pas ignoré — la modale
    # Nouveautés le lit au runtime depuis le conteneur.
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "README.md"
      - "DEVELOPER.md"
      - "CUSTOM_SCRAPERS.md"
      - "ROADMAP.md"
      - "CODE_REVIEW.md"
      - "kavita_api.md"
      - "companion/**/*.md"
      - "debug/**/*.md"

jobs:
  # L'image ne doit jamais partir devant les tests : les deux workflows
  # partageaient les mêmes déclencheurs et tournaient en parallèle, donc un
  # `pytest` rouge n'empêchait pas la publication sur GHCR.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags :
      #   push sur main → :latest (+ :main)
      #   push sur dev  → :dev seulement (ne touche PAS à :latest)
      #   tag git v1.6.1 → :1.6.1 (+ :1.6 + :1)
      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/raukorim-bot/metakavita
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
