name: Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  # Appelé par docker-publish.yml : aucune image ne part sans être passée par ici
  # (y compris sur un tag de release, que les déclencheurs ci-dessus ignorent).
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  companion:
    # L'extension est du JavaScript livré en zip, hors du périmètre de ruff et
    # de pytest : sans ce job, une clé de traduction non déclarée ou un zip
    # oublié partent chez les utilisateurs sans que rien ne s'y oppose.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Syntax check every extension script
        run: |
          find companion -name '*.js' -not -path 'companion/dist/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Self-check URL handling
        run: node companion/scripts/selfcheck-url-match.mjs

      - name: Self-check translations
        run: node companion/scripts/selfcheck-i18n.mjs

      - name: Check the shipped zips match the sources
        run: node companion/scripts/verify-dist.mjs

      - name: Extract the zips the way a Linux user would
        # verify-dist reads the archives with our own zip reader, which proves
        # nothing about a real unzip: 1.0.23 shipped entry names with
        # backslashes and extracted as a flat pile of files named "lib\…".
        run: |
          for zip in companion/dist/*.zip; do
            unzip -t "$zip"
            # Jugé sur le listing d'unzip lui-même, pas sur notre lecteur : un
            # nom comme "lib\storage.js" est un nom de fichier valide ici, et
            # c'est tout le problème.
            if unzip -Z1 "$zip" | grep -q '\\'; then
              echo "antislash dans un nom d'entrée de $zip"
              unzip -Z1 "$zip" | grep '\\'
              exit 1
            fi
            unzip -Z1 "$zip" | grep -q '/' || { echo "$zip est à plat"; exit 1; }
            dest="$(mktemp -d)"
            unzip -q "$zip" -d "$dest"
            test -r "$dest/manifest.json" || { echo "manifest illisible dans $zip"; exit 1; }
            node -e "JSON.parse(require('fs').readFileSync('$dest/manifest.json','utf8'))"
            test -d "$dest/content" -a -d "$dest/lib" -a -d "$dest/_locales" \
              || { echo "arborescence à plat dans $zip"; exit 1; }
            # Un fichier extrait illisible (mode 000) sort d'un zip marqué Unix
            # avec des attributs vides ; le nôtre se déclare MS-DOS exprès.
            if find "$dest" -type f ! -readable | grep -q .; then
              echo "fichier extrait sans droit de lecture dans $zip"
              exit 1
            fi
            rm -rf "$dest"
          done

  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest --verbose
