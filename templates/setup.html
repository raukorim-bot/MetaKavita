<!DOCTYPE html>
<html lang="{{ config.get('UI_LANG', 'fr') }}" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>MetaKavita - {{ t.setup_title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');</script>
</head>
<body style="display: flex; justify-content: center; align-items: center; background-color: var(--bg-app);">
    <div class="card" style="width: 100%; max-width: 400px; text-align: center; padding: 30px;">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" style="height: 60px; margin-bottom: 20px;">
        <h2 style="margin-top: 0; margin-bottom: 8px;">{{ t.setup_title }}</h2>
        <p style="margin-top: 0; margin-bottom: 20px; color: var(--text-muted); font-size: 13px;">{{ t.setup_intro }}</p>

        {% if error %}
        <div class="alert error" style="padding: 8px; margin-bottom: 15px;">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.setup') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            {% if legacy_required %}
            <div class="form-group" style="text-align: left;">
                <input type="password" name="legacy_password" placeholder="{{ t.setup_legacy_label }}" required autofocus
                       autocomplete="current-password" style="padding: 12px; font-size: 16px;">
            </div>
            <p style="margin: 0 0 15px 0; color: var(--text-muted); font-size: 12px; text-align: left;">
                {{ t.setup_legacy_hint }}
            </p>
            {% endif %}
            <div class="form-group" style="text-align: left;">
                <input type="text" name="username" placeholder="{{ t.setup_username }}" required
                       {% if not legacy_required %}autofocus{% endif %}
                       autocomplete="username" style="padding: 12px; font-size: 16px;">
            </div>
            <div class="form-group" style="text-align: left;">
                <input type="password" name="password" placeholder="{{ t.setup_password }}" required
                       minlength="{{ min_password_length }}" autocomplete="new-password"
                       style="padding: 12px; font-size: 16px;">
            </div>
            <div class="form-group" style="text-align: left;">
                <input type="password" name="password_confirm" placeholder="{{ t.setup_password_confirm }}" required
                       minlength="{{ min_password_length }}" autocomplete="new-password"
                       style="padding: 12px; font-size: 16px;">
            </div>
            <p style="margin: 0 0 15px 0; color: var(--text-muted); font-size: 12px; text-align: left;">
                {{ t.setup_password_hint.replace('{}', min_password_length|string) }}
            </p>
            <button type="submit" class="btn-primary w-100" style="padding: 12px; font-size: 16px;">{{ t.setup_create_btn }}</button>
        </form>
    </div>
</body>
</html>
