    <!-- MODAL CASCADES DE FOURNISSEURS (outil de scraping) -->
    <div id="providersModal" class="modal-overlay" onclick="if(event.target===this) closeProvidersModal()">
        <div class="modal-content modal-large modal-shell">
            <div class="modal-header modal-header--providers">
                <h3 class="m-0">{{ t.providers_modal_title }}</h3>
                <button type="button" class="close-btn" onclick="closeProvidersModal()">&times;</button>
            </div>
            <form id="providersForm" class="modal-form" onsubmit="event.preventDefault(); saveProvidersConfig();">
                <div class="modal-scroll-body">
                    <p class="field-hint" style="margin: 0 0 14px;">{{ t.providers_modal_desc }}</p>

                    <div class="config-section config-section--cascade">
                        <div class="cascade-block cascade-block--manga">
                            <div class="cascade-block-label">{{ t.manga_cascade_title }}</div>
                            <div class="providers-row">
                                <div class="form-group">
                                    <label>{{ t.provider_1 }}</label>
                                    <select name="PROVIDER_1" onchange="handleProviderChange(this)">
                                        {% for p in manga_providers %}
                                        <option value="{{ p.id }}" {% if config.get("PROVIDER_1") == p.id %}selected{% endif %}>{{ p.display_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>{{ t.provider_2 }}</label>
                                    <select name="PROVIDER_2" onchange="handleProviderChange(this)">
                                        <option value="NONE" {% if config.get("PROVIDER_2") == "NONE" %}selected{% endif %}>{{ t.provider_none }}</option>
                                        {% for p in manga_providers %}
                                        <option value="{{ p.id }}" {% if config.get("PROVIDER_2") == p.id %}selected{% endif %}>{{ p.display_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="form-group m-0">
                                    <label>{{ t.provider_3 }}</label>
                                    <select name="PROVIDER_3" onchange="handleProviderChange(this)">
                                        <option value="NONE" {% if config.get("PROVIDER_3") == "NONE" %}selected{% endif %}>{{ t.provider_none }}</option>
                                        {% for p in manga_providers %}
                                        <option value="{{ p.id }}" {% if config.get("PROVIDER_3") == p.id %}selected{% endif %}>{{ p.display_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="cascade-block cascade-block--comic">
                            <div class="cascade-block-label">{{ t.comic_cascade_title }}</div>
                            <div class="providers-row">
                                <div class="form-group">
                                    <label>{{ t.provider_1 }}</label>
                                    <select name="COMIC_PROVIDER_1" onchange="handleProviderChange(this)">
                                        {% for p in comic_providers %}
                                        <option value="{{ p.id }}" {% if config.get("COMIC_PROVIDER_1") == p.id %}selected{% endif %}>{{ p.display_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>{{ t.provider_2 }}</label>
                                    <select name="COMIC_PROVIDER_2" onchange="handleProviderChange(this)">
                                        <option value="NONE" {% if config.get("COMIC_PROVIDER_2") == "NONE" %}selected{% endif %}>{{ t.provider_none }}</option>
                                        {% for p in comic_providers %}
                                        <option value="{{ p.id }}" {% if config.get("COMIC_PROVIDER_2") == p.id %}selected{% endif %}>{{ p.display_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="form-group m-0">
                                    <label>{{ t.provider_3 }}</label>
                                    <select name="COMIC_PROVIDER_3" onchange="handleProviderChange(this)">
                                        <option value="NONE" {% if config.get("COMIC_PROVIDER_3") == "NONE" %}selected{% endif %}>{{ t.provider_none }}</option>
                                        {% for p in comic_providers %}
                                        <option value="{{ p.id }}" {% if config.get("COMIC_PROVIDER_3") == p.id %}selected{% endif %}>{{ p.display_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="cascade-block cascade-block--book">
                            <div class="cascade-block-label">{{ t.book_cascade_title }}</div>
                            <div class="providers-row">
                                <div class="form-group">
                                    <label>{{ t.provider_1 }}</label>
                                    <select name="BOOK_PROVIDER_1" onchange="handleProviderChange(this)">
                                        {% for p in book_providers %}
                                        <option value="{{ p.id }}" {% if config.get("BOOK_PROVIDER_1") == p.id %}selected{% endif %}>{{ p.display_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>{{ t.provider_2 }}</label>
                                    <select name="BOOK_PROVIDER_2" onchange="handleProviderChange(this)">
                                        <option value="NONE" {% if config.get("BOOK_PROVIDER_2") == "NONE" %}selected{% endif %}>{{ t.provider_none }}</option>
                                        {% for p in book_providers %}
                                        <option value="{{ p.id }}" {% if config.get("BOOK_PROVIDER_2") == p.id %}selected{% endif %}>{{ p.display_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="form-group m-0">
                                    <label>{{ t.provider_3 }}</label>
                                    <select name="BOOK_PROVIDER_3" onchange="handleProviderChange(this)">
                                        <option value="NONE" {% if config.get("BOOK_PROVIDER_3") == "NONE" %}selected{% endif %}>{{ t.provider_none }}</option>
                                        {% for p in book_providers %}
                                        <option value="{{ p.id }}" {% if config.get("BOOK_PROVIDER_3") == p.id %}selected{% endif %}>{{ p.display_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeProvidersModal()">{{ t.get('cancel', 'Annuler') }}</button>
                    <button type="submit" class="btn-primary" style="padding: 10px 18px;">{{ t.save_providers }}</button>
                </div>
            </form>
        </div>
    </div>
